name: Deploy PoN2 Frontend to AlwaysData

on:
  push:
    branches:
      - claude/pon2-inheritance-detective-app-01CTmAYYjMSDvq3uc5jpCek1
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Clean build artifacts
        run: |
          echo "Cleaning all build artifacts..."
          rm -rf frontend/dist
          rm -rf frontend/node_modules/.vite
          rm -rf frontend/node_modules/.cache
          echo "Build artifacts cleaned successfully"

      - name: Install dependencies
        run: npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: https://api.pon2.yellow-plane.com/api

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            frontend/dist/ \
            ${SSH_USERNAME}@${SSH_HOST}:/home/y-b/pon2/frontend/dist/
