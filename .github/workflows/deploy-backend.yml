name: Deploy Backend to AlwaysData

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pon2-inheritance-detective-app-01CTmAYYjMSDvq3uc5jpCek1
      - claude/restore-pre-merge-state-0UOVb
    paths:
      - 'backend/**'
      - 'scripts/deploy-to-alwaysdata.sh'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ssh-y-b.alwaysdata.net
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd ~
            # Remove existing directory if it's not a git repo
            if [ -d ~/pon2 ] && [ ! -d ~/pon2/.git ]; then
              echo "Removing invalid pon2 directory..."
              rm -rf ~/pon2
            fi
            
            if [ -d ~/pon2/.git ]; then
              echo "Updating existing repository..."
              cd ~/pon2
              git fetch origin
              git reset --hard origin/claude/restore-pre-merge-state-0UOVb
              git clean -fd
            else
              echo "Cloning repository..."
              git clone https://github.com/Martin212038201938/PoN2.git pon2
              cd ~/pon2
              git checkout claude/restore-pre-merge-state-0UOVb
            fi
            bash ~/pon2/scripts/deploy-to-alwaysdata.sh
