name: Deploy Backend to AlwaysData

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pon2-inheritance-detective-app-01CTmAYYjMSDvq3uc5jpCek1
    paths:
      - 'backend/**'
      - 'scripts/deploy-to-alwaysdata.sh'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ssh-y-b.alwaysdata.net
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /home/y-b/pon2 || git clone https://github.com/Martin212038201938/PoN2.git pon2 && cd pon2
            git fetch origin
            git checkout claude/pon2-inheritance-detective-app-01CTmAYYjMSDvq3uc5jpCek1
            git pull origin claude/pon2-inheritance-detective-app-01CTmAYYjMSDvq3uc5jpCek1
            bash scripts/deploy-to-alwaysdata.sh
